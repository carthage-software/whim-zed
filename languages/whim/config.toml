name = "Whim"
grammar = "whim"
path_suffixes = ["whim"]
first_line_pattern = "^#!.*\\bwhim\\b"

line_comments = ["// "]
block_comment = ["/* ", " */"]
word_characters = ["$"]
tab_size = 2

autoclose_before = ";:.,=}])>"

brackets = [
  { start = "{", end = "}", close = true, newline = true },
  { start = "[", end = "]", close = true, newline = true },
  { start = "(", end = ")", close = true, newline = true },
  { start = "'", end = "'", close = true, newline = false, not_in = ["string", "comment"] },
  { start = "\"", end = "\"", close = true, newline = false, not_in = ["string", "comment"] },
]
